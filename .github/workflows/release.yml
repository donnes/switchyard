name: Release

# Run from the Actions tab or with
#   gh workflow run release.yml -f version=0.2.0
# It builds main, signs and notarizes the disk image, and publishes it as
# vX.Y.Z on the commit it built.
#
# Signing and notarizing use these secrets:
#   CSC_LINK           base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD   the .p12's password
#   APPLE_API_KEY      contents of the App Store Connect .p8
#   APPLE_API_KEY_ID   its key ID
#   APPLE_API_ISSUER   its issuer ID
#
# OPENROUTER_API_KEY, optional, has Claude summarize the changes in the notes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, like 0.2.0. Empty is one patch past the last release.
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: namespace-profile-donnes
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases build from main, not $GITHUB_REF."
            exit 1
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          # Info.plist names the first release; later ones default to the next patch.
          next=$(grep -A1 '<key>CFBundleShortVersionString</key>' apps/macos/Support/Info.plist | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          if [[ -n "$latest" ]]; then
            IFS=. read -r major minor patch <<< "${latest#v}"
            next=$major.$minor.$((patch + 1))
          fi
          version=${VERSION:-$next}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$version\" isn't a version like 0.2.0."
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released."
            exit 1
          fi
          if [[ -z "$CSC_LINK" ]]; then
            echo "::error::A release must be signed and notarized, and the signing secrets aren't set."
            exit 1
          fi
          {
            echo "version=$version"
            echo "previous_tag=$latest"
          } >> "$GITHUB_OUTPUT"

  check:
    name: macOS
    needs: prepare
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Tests
        run: swift test -Xswiftc -warnings-as-errors

  build:
    name: Build
    needs: [prepare, check]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This job holds the signing key, so it runs no third-party action and
      # restores no cache.
      - name: Load the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SWITCHYARD_SIGN_IDENTITY=Developer ID Application"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: apps/macos/scripts/release "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: apps/macos/build/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: namespace-profile-donnes
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes read the commits back to the previous tag.
          fetch-depth: 0
          persist-credentials: false
      # Without notes the release falls back to GitHub's generated ones.
      - name: Write release notes
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: scripts/release-notes "$VERSION" "$PREVIOUS_TAG" "$GITHUB_SHA" "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          args=("v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Switchyard $VERSION" --latest)
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              args+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
          fi
          gh release create "${args[@]}"
